<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entry Received</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #17211c; background: #fffaf2; }
    main { width: min(100%, 500px); padding: 42px 32px; text-align: center; background: white; border-radius: 22px; box-shadow: 0 24px 70px rgba(18,49,38,.14); }
    .check { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 20px; color: white; background: #1d4535; border-radius: 50%; font-size: 2rem; font-weight: 900; }
    h1 { margin: 0; font-size: 2rem; }
    p { margin: 14px 0 0; color: #5d6862; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Entry received</h1>
    <p>Thanks—your information has been submitted successfully. You may close this page.</p>
  </main>
</body>
</html>
