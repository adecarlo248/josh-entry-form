<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure entry form for name, phone number, and email address.">
  <meta name="robots" content="noindex, nofollow">
  <title>Entry Form</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211c;
      --muted: #5d6862;
      --forest: #1d4535;
      --forest-dark: #123126;
      --cream: #fffaf2;
      --paper: #ffffff;
      --line: #dfe5e1;
      --accent: #d59b52;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(213,155,82,.19), transparent 32%),
        radial-gradient(circle at 90% 88%, rgba(29,69,53,.14), transparent 34%),
        var(--cream);
    }
    main {
      width: min(100%, 520px);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(29,69,53,.12);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(18,49,38,.14);
    }
    .hero {
      padding: 34px 30px 28px;
      color: white;
      background: linear-gradient(145deg, var(--forest), var(--forest-dark));
    }
    .eyebrow {
      margin: 0 0 9px;
      color: #f0c68d;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 3.25rem); line-height: 1; }
    .hero p { margin: 14px 0 0; color: rgba(255,255,255,.82); line-height: 1.55; }
    form { padding: 28px 30px 32px; }
    label { display: block; margin: 0 0 8px; font-weight: 750; }
    .field { margin-bottom: 20px; }
    input {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fbfcfb;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
    }
    input:focus {
      outline: 3px solid rgba(213,155,82,.26);
      border-color: var(--accent);
    }
    button {
      width: 100%;
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--forest);
      font: inherit;
      font-weight: 850;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(29,69,53,.18);
    }
    button:hover { background: var(--forest-dark); }
    .privacy {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
      text-align: center;
    }
    .trap { position: absolute; left: -9999px; }
    @media (max-width: 420px) {
      body { padding: 0; background: var(--paper); }
      main { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      .hero, form { padding-left: 22px; padding-right: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">Quick &amp; easy</p>
      <h1>Enter your details</h1>
      <p>Complete the three fields below and submit your entry.</p>
    </section>

    <form action="https://formsubmit.co/joshkirkwood@hotmail.com" method="POST">
      <input type="hidden" name="_subject" value="New QR Form Entry">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://adecarlo248.github.io/josh-entry-form/thank-you.html">
      <input class="trap" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="Name" type="text" autocomplete="name" placeholder="Your full name" required maxlength="100">
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="Phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Your phone number" required maxlength="30">
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="Email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required maxlength="150">
      </div>

      <button type="submit">Submit Entry</button>
      <p class="privacy">Your information will be emailed to the organizer and used only to process this entry or contact you about it. This form does not subscribe you to marketing.</p>
    </form>
  </main>
</body>
</html>
